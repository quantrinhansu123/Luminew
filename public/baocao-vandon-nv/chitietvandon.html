<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Chi tiết Vận đơn</title>
    <script src="./supabase-config.js"></script>
    <script src="./regionScope.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CÀI ĐẶT CHUNG --- */
        :root {
            --primary-color: #2d7c2d;
            --primary-light: #4CAF50;
            --primary-dark: #1b4b1b;
            --text-dark: #333;
            --text-medium: #555;
            --bg-light: #f4f4f4;
            --border-color: #e0e0e0;
            --font-main: 'Roboto', Arial, sans-serif;
        }

        body {
            font-family: var(--font-main);
            padding: 10px 12px;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.45;
        }

        /* --- TABS --- */

        .tab-btn {
            padding: 15px 25px;
            cursor: pointer;
            border: none;
            background-color: transparent;
            font-size: 18px;
            font-weight: 500;
            color: var(--text-medium);
            position: relative;
        }
        
        .tab-btn.active {
            color: var(--primary-dark);
            position: relative;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -3px; /* Đặt dưới border của container */
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--primary-dark);
        }

        .tab-content {
            display: none;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-top: none;
            animation: fadeIn 0.5s;
            background-color: #fff;
            border-radius: 0 0 8px 8px;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- STYLES CHO BỘ LỌC VÀ ĐIỀU KHIỂN --- */
        #DonChiTiet .controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 6px;
            background: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #DonChiTiet .controls .filter-row-compact {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        #DonChiTiet .controls .left-controls,
        #DonChiTiet .controls .right-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        #DonChiTiet .controls .date-filter {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
        }

        #DonChiTiet .controls button:not(.tab-btn) {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            color: white;
            background-color: #27ae60;
            cursor: pointer;
            white-space: nowrap;
        }

        #DonChiTiet .controls button:not(.tab-btn):hover {
            background-color: #229954;
        }
        
        .clear-filter-btn {
            background-color: #f39c12 !important;
        }

        .clear-filter-btn:hover {
            background-color: #e67e22 !important;
        }

        #DonChiTiet .controls input[type="date"],
        #DonChiTiet .controls input[type="text"],
        #DonChiTiet .controls select {
            padding: 5px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            background-color: white;
        }

        #DonChiTiet #detailNameFilter {
            min-width: 160px;
            max-width: 220px;
        }

        #DonChiTiet .multi-select-container {
            position: relative;
            display: inline-block;
        }

        #DonChiTiet .multi-select-container button {
            background-color: white;
            color: #333;
            border: 1px solid #ccc;
            font-size: 12px;
            padding: 5px 8px;
            text-align: left;
            width: 132px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .checkbox-dropdown {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 250px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 101;
            border: 1px solid #ddd;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
        }

        .checkbox-dropdown.show {
            display: block;
        }

        .checkbox-dropdown label {
            display: flex;       
            align-items: center; 
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
            white-space: nowrap;
            color: var(--text-dark);
        }

        .checkbox-dropdown label:hover {
            background-color: #f1f1f1;
        }
        
        .checkbox-dropdown label input {
            margin-right: 10px;
        }

        /* --- STYLES CỤ THỂ CHO TAB CHI TIẾT --- */
        #DonChiTiet h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.1rem;
            color: #2c3e50;
        }

        #DonChiTiet .table-wrapper {
            position: relative;
            overflow: auto;
            max-height: calc(100vh - 155px);
            min-height: 320px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-top: 6px;
        }

        #DonChiTiet table {
            border-collapse: collapse;
            width: 100%;
            min-width: 1800px;
            font-size: 11px;
            font-weight: bold;
        }

        #DonChiTiet th,
        #DonChiTiet td {
            border: 1px solid #e0e0e0;
            padding: 6px 10px;
            white-space: nowrap;
            background-color: white;
            text-align: left !important;
        }

        #DonChiTiet th {
            background-color: #2c3e50;
            color: white;
            font-weight: 500;
            vertical-align: middle;
            position: sticky;
            z-index: 20;
            text-align: center !important;
        }
        
        #DonChiTiet th.header-title {
            top: 0; /* Tiêu đề dính ở trên cùng */
        }
        
        #DonChiTiet tr.filter-row {
            position: sticky;
            top: 30px; /* Dính ngay dưới hàng tiêu đề */
            z-index: 21; /* Phải cao hơn z-index của tiêu đề */
        }
        
        #DonChiTiet thead .filter-row th {
            padding: 5px;
            background-color: #e8f5e9; /* Màu nền nhạt cho hàng lọc */
            vertical-align: top;
        }

        #DonChiTiet thead .filter-row input,
        #DonChiTiet thead .filter-row .multi-select-container button {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 11px; /* Cỡ chữ nhỏ hơn cho ô lọc */
        }

        /* CSS cho dropdown bộ lọc trong cột gọn gàng hơn */
        #DonChiTiet .filter-row .checkbox-dropdown {
            min-width: max-content;
            width: auto;
            padding: 5px;
        }

        #DonChiTiet .filter-row .checkbox-dropdown label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 6px;
            font-size: 11px;
            line-height: 1.4;
            white-space: nowrap;
        }

        #DonChiTiet .filter-row .checkbox-dropdown input[type="checkbox"] {
            margin: 0;
            width: 14px;
            height: 14px;
        }

        .no-data {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-style: italic;
            font-size: 16px;
        }

        /* --- Thanh tóm tắt (một dòng gọn) --- */
        #DonChiTiet .summary-bar {
            background-color: #e8f5e9;
            padding: 6px 12px;
            border-radius: 4px;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-items: center;
            gap: 20px 28px;
            margin: 4px 0 6px;
            border-left: 3px solid var(--primary-color);
        }

        #DonChiTiet .summary-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
            text-align: left;
        }

        #DonChiTiet .summary-item .label {
            font-size: 12px;
            color: var(--text-medium);
            font-weight: 500;
        }

        #DonChiTiet .summary-item .value {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-dark);
        }

        #DonChiTiet .region-container {
            margin-top: 8px;
        }

        #DonChiTiet .region-header {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 4px;
            border-bottom: 1px solid var(--primary-light);
            padding-bottom: 3px;
        }

        /* --- SCROLLBAR & LOADING --- */
        ::-webkit-scrollbar {
            height: 12px;
            width: 12px;
        }
        ::-webkit-scrollbar-thumb {
            border-radius: 5px;
            background-color: #27ae60;
            border: 2px solid #f5f5f5;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: all 0.3s ease;
            visibility: hidden;
            opacity: 0;
            backdrop-filter: blur(4px);
        }

        #loading-overlay.visible {
            visibility: visible;
            opacity: 1;
        }

        .loading-content {
            text-align: center;
        }

        .loading-logo {
            max-width: 200px;
            width: 40vw;
            height: auto;
            animation: pulse 2s infinite ease-in-out;
        }

        .loading-text {
            margin-top: 20px;
            font-size: 1.3em;
            font-weight: 500;
            color: var(--primary-color);
        }
    </style>
</head>

<body>

    <!-- Chỉ báo đang tải -->
    <div id="loading-overlay">
        <div class="loading-content">
            <div class="loading-text">Đang tải dữ liệu...</div>
        </div>
    </div>

    <!-- Nội dung của Tab 2 -->
    <div id="DonChiTiet" class="tab-content active">
        <div class="controls">
            <div class="filter-row-compact left-controls">
                 <div class="multi-select-container">
                    <button id="detailTeamFilterBtn">Tất cả Team</button>
                    <div id="detailTeamDropdown" class="checkbox-dropdown"></div>
                </div>
                 <div class="multi-select-container">
                    <button id="detailStaffFilterBtn">Tất cả NV</button>
                    <div id="detailStaffDropdown" class="checkbox-dropdown"></div>
                </div>
                <div class="multi-select-container">
                    <button id="detailProductFilterBtn">Tất cả Sản phẩm</button>

                </div>
                <div class="multi-select-container">
                    <button id="detailMarketFilterBtn">Tất cả Khu vực</button>

            <div class="filter-row-compact right-controls">
                <div class="date-filter">

                <input type="text" id="detailNameFilter" placeholder="Tìm theo Tên, SĐT, Mã đơn..." />
                <button id="detailClearFilters" class="clear-filter-btn">Xóa lọc</button>
                <button type="button" id="detailLoadFullBtn" class="clear-filter-btn" title="Tải mọi đơn từ máy chủ — có thể rất chậm">Tải toàn bộ</button>
            </div>
        </div>

        <div class="summary-bar">
            <div class="summary-item">
                <div class="label">Tổng số đơn</div>
                <div class="value" id="totalOrdersCount">0</div>
            </div>
            <div class="summary-item">
                <div class="label">Tổng thành tiền</div>
                <div class="value" id="totalOrdersAmount">0 ₫</div>
            </div>
        </div>

        <!-- Các bảng chi tiết sẽ được render động vào đây -->
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- CÁC HÀM TIỆN ÍCH ---
            const loader = document.getElementById('loading-overlay');
            const showLoader = () => loader.classList.add('visible');
            const hideLoader = () => loader.classList.remove('visible');
            let globalData = []; // Lưu trữ toàn bộ dữ liệu
            let loadDataDebounce = null;
            const DETAIL_RANGE_DAYS = (window.VandonNvRegion && VandonNvRegion.PRELOAD_ORDER_DAYS) || 10;

            function setDefaultDetailDateRange() {
                if (window.VandonNvRegion && VandonNvRegion.applyPreloadDateRangeToInputs) {
                    VandonNvRegion.applyPreloadDateRangeToInputs(
                        'detailStartDateFilter',
                        'detailEndDateFilter',
                        DETAIL_RANGE_DAYS
                    );
                    return;
                }
                const end = new Date();
                const start = new Date();
                start.setDate(start.getDate() - (DETAIL_RANGE_DAYS - 1));
                const fmt = (d) => d.toISOString().slice(0, 10);
                const sEl = document.getElementById('detailStartDateFilter');
                const eEl = document.getElementById('detailEndDateFilter');
                if (sEl) sEl.value = fmt(start);
                if (eEl) eEl.value = fmt(end);
            }

            function scheduleReloadFromApi() {
                clearTimeout(loadDataDebounce);
                loadDataDebounce = setTimeout(() => loadData({}), 400);
            }

            // ===================================================================
            // SỬA LỖI: CÁC HÀM CHUẨN HÓA VÀ XỬ LÝ DỮ LIỆU ĐA DẠNG
            // ===================================================================
            
            /**
             * Chuẩn hóa một chuỗi ngày tháng (ví dụ: dd/mm/yyyy, Excel serial) thành định dạng YYYY-MM-DD.
             * Đây là chìa khóa để so sánh ngày tháng chính xác.
             * @param {string | number | null} input - Giá trị ngày tháng đầu vào.
             * @returns {string} - Chuỗi ngày tháng ở định dạng 'YYYY-MM-DD' hoặc chuỗi rỗng nếu không hợp lệ.
             */
            function normalizeDateToYMD(input) {
                if (!input) return '';
                const str = String(input).trim();

                // 1. Thử phân tích cú pháp các định dạng chuẩn (ISO, có 'T', có '-')
                const d1 = new Date(str);
                if (!isNaN(d1.getTime())) {
                    const y = d1.getFullYear();
                    const m = String(d1.getMonth() + 1).padStart(2, '0');
                    const d = String(d1.getDate()).padStart(2, '0');
                    return `${y}-${m}-${d}`;
                }

                // 2. Thử phân tích cú pháp định dạng dd/mm/yyyy hoặc dd-mm-yyyy
                const m1 = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
                if (m1) {
                    const y = +m1[3];
                    const m = String(+m1[2]).padStart(2, '0');
                    const d = String(+m1[1]).padStart(2, '0');
                    return `${y}-${m}-${d}`;
                }

                // 3. Thử phân tích cú pháp số sê-ri ngày của Excel
                if (/^\d+(\.\d+)?$/.test(str)) {
                    const excelEpoch = new Date(Date.UTC(1899, 11, 30));
                    const d = new Date(excelEpoch.getTime() + (parseFloat(str) * 86400000));
                    if (!isNaN(d.getTime())) {
                    const y = d.getUTCFullYear();
                    const m = String(d.getUTCMonth() + 1).padStart(2, '0');
                    const day = String(d.getUTCDate()).padStart(2, '0');
                    return `${y}-${m}-${day}`;
                    }
                }

                return ''; // Trả về chuỗi rỗng nếu không thể phân tích cú pháp
            }

            /**
             * Chuyển chuỗi tiền tệ (ví dụ "120.000 ₫", "500k", "1.2m") thành số (VND).
             * @param {string | number | null} str - Chuỗi tiền tệ cần chuyển đổi.
             * @returns {number} - Giá trị số, hoặc NaN nếu không hợp lệ.
             */
            function parseMoneyToNumber(str) {
                if (str == null) return NaN;
                let s = String(str).toLowerCase().trim();

                s = s.replace(/[₫\s,]/g, '');

                const match = s.match(/^([<>]=?|=)?\s*([0-9]*\.?[0-9]+)\s*([kmb])?$/i);
                if (match) {
                    const num = parseFloat(match[2]);
                    const suffix = (match[3] || '').toLowerCase();
                    let mul = 1;
                    if (suffix === 'k') mul = 1_000;
                    if (suffix === 'm') mul = 1_000_000;
                    if (suffix === 'b') mul = 1_000_000_000;
                    return num * mul;
                }

                const digits = s.replace(/[^\d.]/g, '');
                if (digits.includes('.')) {
                    const noDots = digits.replace(/\./g, '');
                    return parseInt(noDots || '0', 10);
                }
                return parseInt(digits || '0', 10);
            }

            /**
             * Kiểm tra một số tiền có khớp với biểu thức lọc của người dùng hay không.
             * Hỗ trợ: ">500k", ">=1m", "< 200000", "100k-300k", "=150000", "150000".
             * @param {number} amount - Số tiền cần kiểm tra.
             * @param {string} exprRaw - Biểu thức lọc từ người dùng.
             * @returns {boolean} - True nếu khớp, false nếu không.
             */
            function matchAmount(amount, exprRaw) {
                if (isNaN(amount)) return false;
                const expr = String(exprRaw).toLowerCase().trim().replace(/\s+/g, '');

                const range = expr.match(/^([0-9]*\.?[0-9]+[kmb]?)-([0-9]*\.?[0-9]+[kmb]?)$/i);
                if (range) {
                    const a = parseMoneyToNumber(range[1]);
                    const b = parseMoneyToNumber(range[2]);
                    if (isNaN(a) || isNaN(b)) return false;
                    const min = Math.min(a, b);
                    const max = Math.max(a, b);
                    return amount >= min && amount <= max;
                }

                const cmp = expr.match(/^(>=|<=|>|<|=)?([0-9]*\.?[0-9]+[kmb]?)$/i);
                if (cmp) {
                    const op = cmp[1] || '=';
                    const val = parseMoneyToNumber(cmp[2]);
                    if (isNaN(val)) return false;
                    if (op === '>')  return amount >  val;
                    if (op === '>=') return amount >= val;
                    if (op === '<')  return amount <  val;
                    if (op === '<=') return amount <= val;
                    return amount === val;
                }
                
                const digits = expr.replace(/[^\d]/g, '');
                const amtDigits = String(Math.round(amount)).replace(/[^\d]/g, '');
                return amtDigits.includes(digits);
            }

            
            // --- XỬ LÝ DỮ LIỆU CHÍNH ---
            function normalizeApiRowsPayload(payload) {
                if (window.VandonNvRegion && window.VandonNvRegion.normalizeApiRowsPayload) {
                    return window.VandonNvRegion.normalizeApiRowsPayload(payload);
                }
                if (Array.isArray(payload)) return { rows: payload };
                return { rows: [] };
            }

            function getRowValue(row, ...keys) {
                for (const k of keys) {
                    if (row[k] !== undefined && row[k] !== null && row[k] !== '') return row[k];
                }
                return '';
            }

            function normalizeSourceRow(row) {
                return {
                    ...row,
                    "Mã đơn hàng": getRowValue(row, "Mã đơn hàng", "Mã_đơn_hàng"),
                    "Mã Tracking": getRowValue(row, "Mã Tracking", "Mã_Tracking"),
                    "Ngày lên đơn": getRowValue(row, "Ngày lên đơn", "Ngày_lên_đơn", "Thời gian lên đơn"),
                    "Thông tin khách hàng": getRowValue(row, "Thông tin khách hàng", "Thông_tin_khách_hàng"),
                    "Phone*": getRowValue(row, "Phone*", "Phone"),
                    "Mặt hàng": getRowValue(row, "Mặt hàng", "Mặt_hàng"),
                    "Số lượng mặt hàng 1": getRowValue(row, "Số lượng mặt hàng 1", "Số_lượng_mặt_hàng_1"),
                    "Tổng tiền VNĐ": getRowValue(row, "Tổng tiền VNĐ", "Tổng_tiền_VNĐ"),
                    "Nhân sự Marketing": getRowValue(row, "Nhân sự Marketing", "Nhân_viên_Marketing"),
                    "Nhân sự Sale": getRowValue(row, "Nhân sự Sale", "Nhân_viên_Sale"),
                    "NV Vận đơn": VandonNvRegion.resolveNvVanDon(row),
                    "Đơn vị vận chuyển": getRowValue(row, "Đơn vị vận chuyển", "Đơn_vị_vận_chuyển"),
                    "Trạng thái giao hàng NB": getRowValue(row, "Trạng thái giao hàng NB", "Trạng_thái_giao_hàng_NB", "Trạng_thái_giao_hàng"),
                    "Kết quả Check": getRowValue(row, "Kết quả Check", "Kết_quả_Check"),
                    "Trạng thái thu tiền": getRowValue(row, "Trạng thái thu tiền", "Trạng_thái_thu_tiền"),
                    "Khu vực": getRowValue(row, "Khu vực", "Khu_vực", "khu vực"),
                    "khu vực": getRowValue(row, "khu vực", "Khu_vực", "Khu vực"),
                    "Team": getRowValue(row, "Team", "Chi nhánh", "Chi_nhánh")
                };
            }

function handleData(response) {
                hideLoader();
                if (response.error || !Array.isArray(response.rows)) {
                    detailApp.showError('DonChiTiet', 'Lỗi hoặc không có dữ liệu: ' + (response.error || 'Định dạng dữ liệu không đúng'));
                    return;
                }
                //xử lý chỉ lấy dữ liệu có Mã đơn hàng
                globalData = response.rows
                    .map(normalizeSourceRow)
                    .filter(r => getRowValue(r, "Mã đơn hàng", "Mã_đơn_hàng"));
                /* API chỉ trả về order_code_hcm — không lọc thêm theo Team. */
                detailApp.populateFilters();
                detailApp.applyFilters();
            }

            function loadData(opts) {
                const options = opts || {};
                showLoader();
                let dateRange;
                if (options.full) {
                    dateRange = { full: true, startDate: '', endDate: '' };
                } else {
                    dateRange = VandonNvRegion.readDateFilterValues(
                        'detailStartDateFilter',
                        'detailEndDateFilter'
                    );
                    if (!dateRange.startDate || !dateRange.endDate) {
                        dateRange = VandonNvRegion.getPreloadOrderDateRange(DETAIL_RANGE_DAYS);
                    }
                    dateRange = VandonNvRegion.resolveOrderHcmDateRange(dateRange);
                }

                const staffPromise = VandonNvRegion.fetchVanDonNvStaffDirectory();

                Promise.all([
                    VandonNvRegion.fetchOrderHcmRows(dateRange),
                    staffPromise,
                ])
                    .then(([data, staffDirectory]) => {
                        detailApp.vanDonStaffDirectory = staffDirectory;
                        handleData(normalizeApiRowsPayload(data));
                    })
                    .catch(error => {
                        console.error('Lỗi khi tải dữ liệu:', error);
                        const errorMsg = 'Tải dữ liệu thất bại. Vui lòng kiểm tra kết nối mạng và thử lại.';
                        detailApp.showError('DonChiTiet', errorMsg);
                        hideLoader();
                    });
            }

            // ===================================================================
            // =========== MODULE CHO CHI TIẾT VẬN ĐƠN (TAB 2) ================
            // ===================================================================
            const detailApp = {
                tableCache: new Map(),
                vanDonStaffDirectory: [],
                init: function () {
                    this.setupControls();
                },
                showError: function (tableId, message) {
                    const container = document.getElementById(tableId);
                    if (!container) return;
                    const summaryBar = container.querySelector('.summary-bar');
                    if (!summaryBar) return;
                    
                    container.querySelectorAll('.region-container').forEach(c => c.remove());

                    const errorContainer = document.createElement('div');
                    errorContainer.className = 'region-container';
                    errorContainer.innerHTML = `<div class="no-data" style="margin-top:20px;">${message}</div>`;
                    summaryBar.parentNode.insertBefore(errorContainer, summaryBar.nextSibling);
                },
                populateFilters: function () {
                    const changeCallback = () => this.applyFilters();
                    const checkResults = [...new Set(globalData.map(r => r["Kết quả Check"]).filter(Boolean))].sort();
                    const deliveryStatuses = [...new Set(globalData.map(r => r["Trạng thái giao hàng NB"]).filter(Boolean))].sort();
                    const paymentStatuses = [...new Set(globalData.map(r => r["Trạng thái thu tiền"]).filter(Boolean))].sort();
                    const allStaff = VandonNvRegion.mergeVanDonStaffFilterList(
                        globalData,
                        this.vanDonStaffDirectory
                    );
                    const allProducts = [...new Set(globalData.map(r => r["Mặt hàng"]).filter(Boolean))].sort();
                    const allMarkets = [...new Set(globalData.map(r => r["Khu vực"] || r["khu vực"]).filter(Boolean))].sort();
                    const allTeams = [...new Set(globalData.map(r => r["Team"]).filter(Boolean))].sort();
                    const allShippingUnits = [...new Set(globalData.map(r => r["Đơn vị vận chuyển"]).filter(Boolean))].sort();

                    this.populateMultiSelect('detailCheckResultDropdown', 'detailCheckResultSelectAll', checkResults, () => { this.updateFilterButtonText('detailCheckResultFilterBtn', 'detailCheckResultDropdown', 'detailCheckResultSelectAll', 'Kết quả check'); changeCallback(); });
                    this.populateMultiSelect('detailDeliveryStatusDropdown', 'detailDeliveryStatusSelectAll', deliveryStatuses, () => { this.updateFilterButtonText('detailDeliveryStatusFilterBtn', 'detailDeliveryStatusDropdown', 'detailDeliveryStatusSelectAll', 'Trạng thái GH'); changeCallback(); });
                    this.populateMultiSelect('detailPaymentStatusDropdown', 'detailPaymentStatusSelectAll', paymentStatuses, () => { this.updateFilterButtonText('detailPaymentStatusFilterBtn', 'detailPaymentStatusDropdown', 'detailPaymentStatusSelectAll', 'Trạng thái TT'); changeCallback(); });
                    this.populateMultiSelect('detailStaffDropdown', 'detailStaffSelectAll', allStaff, () => { this.updateFilterButtonText('detailStaffFilterBtn', 'detailStaffDropdown', 'detailStaffSelectAll', 'NV'); changeCallback(); });
                    this.populateMultiSelect('detailProductDropdown', 'detailProductSelectAll', allProducts, () => { this.updateFilterButtonText('detailProductFilterBtn', 'detailProductDropdown', 'detailProductSelectAll', 'Sản phẩm'); changeCallback(); });
                    this.populateMultiSelect('detailMarketDropdown', 'detailMarketSelectAll', allMarkets, () => { this.updateFilterButtonText('detailMarketFilterBtn', 'detailMarketDropdown', 'detailMarketSelectAll', 'Khu vực'); changeCallback(); });
                    this.populateMultiSelect('detailTeamDropdown', 'detailTeamSelectAll', allTeams, () => { this.updateFilterButtonText('detailTeamFilterBtn', 'detailTeamDropdown', 'detailTeamSelectAll', 'Team'); changeCallback(); });
                    this.populateMultiSelect('detailShippingUnitDropdown', 'detailShippingUnitSelectAll', allShippingUnits, () => { this.updateFilterButtonText('detailShippingUnitFilterBtn', 'detailShippingUnitDropdown', 'detailShippingUnitSelectAll', 'Đơn vị vận chuyển'); changeCallback(); });
                    
                    // Xử lý đặc biệt cho tracking dropdown
                    const trackingDropdown = document.getElementById('detailTrackingDropdown');
                    if (trackingDropdown) {
                        trackingDropdown.addEventListener('change', (e) => {
                            if (e.target.id === 'detailTrackingSelectAll') {
                                trackingDropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = e.target.checked);
                            } else {
                                const allCb = document.getElementById('detailTrackingSelectAll');
                                const totalOptions = trackingDropdown.querySelectorAll('input[type="checkbox"]:not(#detailTrackingSelectAll)').length;
                                if (allCb) allCb.checked = trackingDropdown.querySelectorAll('input:checked:not(#detailTrackingSelectAll)').length === totalOptions;
                            }
                            this.updateFilterButtonText('detailTrackingFilterBtn', 'detailTrackingDropdown', 'detailTrackingSelectAll', 'mã tracking');
                            changeCallback();
                        });
                    }
                },
                populateMultiSelect: function(dropdownId, selectAllId, items, changeCallback) {
                    const dropdown = document.getElementById(dropdownId);
                    if (!dropdown) return;

                    dropdown.innerHTML = '';
                    const allLabel = document.createElement('label');
                    allLabel.innerHTML = `<input type="checkbox" id="${selectAllId}"> <b>Chọn tất cả</b>`;
                    dropdown.appendChild(allLabel);

                    // Thêm tùy chọn "Trống" cho tất cả dropdown (trừ tracking vì đã có sẵn)
                    if (dropdownId !== 'detailTrackingDropdown') {
                        const emptyLabel = document.createElement('label');
                        emptyLabel.innerHTML = `<input type="checkbox" value="__EMPTY__"> <em>Trống</em>`;
                        emptyLabel.querySelector('input').addEventListener('change', () => {
                            // Đồng bộ checkbox "Chọn tất cả"
                            const totalOptions = dropdown.querySelectorAll(`input[type="checkbox"]:not(#${selectAllId})`).length;
                            const selectedOptions = dropdown.querySelectorAll(`input:checked:not(#${selectAllId})`).length;
                            const selectAllCb = document.getElementById(selectAllId);
                            if (selectAllCb) selectAllCb.checked = selectedOptions === totalOptions;
                            
                            changeCallback();
                        });
                        dropdown.appendChild(emptyLabel);
                    }

                    items.forEach(item => {
                        const label = document.createElement('label');
                        const encodedItem = item.replace(/"/g, '&quot;');
                        label.innerHTML = `<input type="checkbox" value="${encodedItem}"> ${item}`;
                        label.querySelector('input').addEventListener('change', () => {
                            // Đồng bộ checkbox "Chọn tất cả"
                            const totalOptions = dropdown.querySelectorAll(`input[type="checkbox"]:not(#${selectAllId})`).length;
                            const selectedOptions = dropdown.querySelectorAll(`input:checked:not(#${selectAllId})`).length;
                            const selectAllCb = document.getElementById(selectAllId);
                            if (selectAllCb) selectAllCb.checked = selectedOptions === totalOptions;
                            
                            changeCallback();
                        });
                        dropdown.appendChild(label);
                    });

                    document.getElementById(selectAllId)?.addEventListener('change', (e) => {
                        dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = e.target.checked);
                        changeCallback();
                    });
                },
                updateFilterButtonText: function (btnId, dropdownId, selectAllId, defaultTextPrefix) {
                    const btn = document.getElementById(btnId);
                    const dropdown = document.getElementById(dropdownId);
                    if (!btn || !dropdown) return;
                    const selectedCount = dropdown.querySelectorAll(`input:checked:not(#${selectAllId})`).length;
                    const totalCount = dropdown.querySelectorAll(`input[type="checkbox"]:not(#${selectAllId})`).length;

                    if (selectedCount === 0 || selectedCount === totalCount) {
                        btn.textContent = `Tất cả ${defaultTextPrefix}`;
                    } else if (selectedCount === 1) {
                        const selectedValue = dropdown.querySelector(`input:checked:not(#${selectAllId})`).value;
                        btn.textContent = selectedValue === '__EMPTY__' ? 'Trống' : selectedValue;
                    } else {
                        btn.textContent = `${selectedCount} ${defaultTextPrefix} đã chọn`;
                    }
                },
                setupControls: function () {
                    const apply = this.applyFilters.bind(this);
                    
                    document.getElementById('detailStartDateFilter')?.addEventListener('change', scheduleReloadFromApi);
                    document.getElementById('detailEndDateFilter')?.addEventListener('change', scheduleReloadFromApi);
                    document.getElementById('detailNameFilter')?.addEventListener('input', apply);

                    this.setupMultiSelectDropdown('detailStaffFilterBtn', 'detailStaffDropdown');
                    this.setupMultiSelectDropdown('detailProductFilterBtn', 'detailProductDropdown');
                    this.setupMultiSelectDropdown('detailMarketFilterBtn', 'detailMarketDropdown');
                    this.setupMultiSelectDropdown('detailTeamFilterBtn', 'detailTeamDropdown');
                    this.setupMultiSelectDropdown('detailCheckResultFilterBtn', 'detailCheckResultDropdown');
                    this.setupMultiSelectDropdown('detailDeliveryStatusFilterBtn', 'detailDeliveryStatusDropdown');
                    this.setupMultiSelectDropdown('detailPaymentStatusFilterBtn', 'detailPaymentStatusDropdown');
                    this.setupMultiSelectDropdown('detailTrackingFilterBtn', 'detailTrackingDropdown');
                    this.setupMultiSelectDropdown('detailShippingUnitFilterBtn', 'detailShippingUnitDropdown');

                    document.getElementById('detailLoadFullBtn')?.addEventListener('click', () => {
                        if (!confirm('Tải toàn bộ đơn có thể rất chậm và nặng trình duyệt. Tiếp tục?')) return;
                        document.getElementById('detailStartDateFilter').value = '';
                        document.getElementById('detailEndDateFilter').value = '';
                        loadData({ full: true });
                    });

                    document.getElementById('detailClearFilters')?.addEventListener('click', () => {
                        setDefaultDetailDateRange();
                        document.getElementById('detailNameFilter').value = '';
                        
                        document.querySelectorAll('#DonChiTiet .filter-row .column-filter').forEach(element => {
                            if (element.tagName === 'INPUT') element.value = '';
                            else if (element.classList.contains('multi-select-container')) {
                                const dropdown = element.querySelector('.checkbox-dropdown');
                                const button = element.querySelector('button');
                                if (dropdown && button) {
                                    dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
                                    this.updateColumnMultiSelectButtonText(button, dropdown);
                                }
                            }
                        });
                        
                        const filterConfigs = [
                           { type: 'Team', prefix: 'Team' }, { type: 'Staff', prefix: 'NV' },
                           { type: 'Product', prefix: 'Sản phẩm' }, { type: 'Market', prefix: 'Khu vực' },
                           { type: 'CheckResult', prefix: 'Kết quả check' }, { type: 'DeliveryStatus', prefix: 'Trạng thái GH' },
                           { type: 'PaymentStatus', prefix: 'Trạng thái TT' }, { type: 'Tracking', prefix: 'mã tracking' },
                           { type: 'ShippingUnit', prefix: 'Đơn vị vận chuyển' }
                        ];

                        filterConfigs.forEach(config => {
                            const dropdown = document.getElementById(`detail${config.type}Dropdown`);
                            if (dropdown) {
                                dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
                                this.updateFilterButtonText(`detail${config.type}FilterBtn`, `detail${config.type}Dropdown`, `detail${config.type}SelectAll`, config.prefix);
                            }
                        });
                        loadData({});
                    });

                    window.addEventListener('click', () => {
                        document.querySelectorAll('#DonChiTiet .checkbox-dropdown.show').forEach(d => d.classList.remove('show'));
                    });
                },
                setupMultiSelectDropdown: function (btnId, dropdownId) {
                    const btn = document.getElementById(btnId);
                    const dropdown = document.getElementById(dropdownId);
                    if (btn && dropdown) {
                        btn.addEventListener('click', (e) => { e.stopPropagation(); dropdown.classList.toggle('show'); });
                        dropdown.addEventListener('click', e => e.stopPropagation());
                        window.addEventListener('click', (e) => {
                            if (!btn.contains(e.target) && !dropdown.contains(e.target)) {
                                dropdown.classList.remove('show');
                            }
                        });
                    }
                },
                applyFilters: function () {
                    let filteredData = [...globalData];
                    
                    const getSelected = (id, allId) => Array.from(document.querySelectorAll(`#${id} input:checked:not(#${allId})`)).map(cb => cb.value);

                    const selectedCheckResults = getSelected('detailCheckResultDropdown', 'detailCheckResultSelectAll');
                    const selectedDeliveryStatuses = getSelected('detailDeliveryStatusDropdown', 'detailDeliveryStatusSelectAll');
                    const selectedPaymentStatuses = getSelected('detailPaymentStatusDropdown', 'detailPaymentStatusSelectAll');
                    const nameQuery = document.getElementById('detailNameFilter').value.toLowerCase().trim();
                    const selectedStaff = getSelected('detailStaffDropdown', 'detailStaffSelectAll');
                    const selectedProducts = getSelected('detailProductDropdown', 'detailProductSelectAll');
                    const selectedMarkets = getSelected('detailMarketDropdown', 'detailMarketSelectAll');
                    const selectedTeams = getSelected('detailTeamDropdown', 'detailTeamSelectAll');
                    const selectedTracking = getSelected('detailTrackingDropdown', 'detailTrackingSelectAll');
                    const selectedShippingUnits = getSelected('detailShippingUnitDropdown', 'detailShippingUnitSelectAll');

                    // Lọc nhân viên vận đơn
                    if (selectedStaff.length > 0) {
                        filteredData = filteredData.filter(row => {
                            const staffValue = VandonNvRegion.resolveNvVanDon(row);
                            const isEmpty = !staffValue;
                            
                            return selectedStaff.some(filter => {
                                if (filter === '__EMPTY__') return isEmpty;
                                return !isEmpty && staffValue === filter;
                            });
                        });
                    }
                    
                    // Lọc sản phẩm
                    if (selectedProducts.length > 0) {
                        filteredData = filteredData.filter(row => {
                            const productValue = (row["Mặt hàng"] || '').trim();
                            const isEmpty = !productValue;
                            
                            return selectedProducts.some(filter => {
                                if (filter === '__EMPTY__') return isEmpty;
                                return !isEmpty && productValue === filter;
                            });
                        });
                    }
                    
                    // Lọc khu vực
                    if (selectedMarkets.length > 0) {
                        filteredData = filteredData.filter(row => {
                            const marketValue = (row["Khu vực"] || row["khu vực"] || '').trim();
                            const isEmpty = !marketValue;
                            
                            return selectedMarkets.some(filter => {
                                if (filter === '__EMPTY__') return isEmpty;
                                return !isEmpty && marketValue === filter;
                            });
                        });
                    }
                    
                    // Lọc team
                    if (selectedTeams.length > 0) {
                        filteredData = filteredData.filter(row => {
                            const teamValue = (row["Team"] || '').trim();
                            const isEmpty = !teamValue;
                            
                            return selectedTeams.some(filter => {
                                if (filter === '__EMPTY__') return isEmpty;
                                return !isEmpty && teamValue === filter;
                            });
                        });
                    }
                    
                    // Lọc kết quả check
                    if (selectedCheckResults.length > 0) {
                        filteredData = filteredData.filter(row => {
                            const checkValue = (row["Kết quả Check"] || '').trim();
                            const isEmpty = !checkValue;
                            
                            return selectedCheckResults.some(filter => {
                                if (filter === '__EMPTY__') return isEmpty;
                                return !isEmpty && checkValue === filter;
                            });
                        });
                    }
                    
                    // Lọc trạng thái giao hàng
                    if (selectedDeliveryStatuses.length > 0) {
                        filteredData = filteredData.filter(row => {
                            const deliveryValue = (row["Trạng thái giao hàng NB"] || '').trim();
                            const isEmpty = !deliveryValue;
                            
                            return selectedDeliveryStatuses.some(filter => {
                                if (filter === '__EMPTY__') return isEmpty;
                                return !isEmpty && deliveryValue === filter;
                            });
                        });
                    }
                    
                    // Lọc trạng thái thu tiền
                    if (selectedPaymentStatuses.length > 0) {
                        filteredData = filteredData.filter(row => {
                            const paymentValue = (row["Trạng thái thu tiền"] || '').trim();
                            const isEmpty = !paymentValue;
                            
                            return selectedPaymentStatuses.some(filter => {
                                if (filter === '__EMPTY__') return isEmpty;
                                return !isEmpty && paymentValue === filter;
                            });
                        });
                    }
                    
                    // Lọc đơn vị vận chuyển
                    if (selectedShippingUnits.length > 0) {
                        filteredData = filteredData.filter(row => {
                            const shippingValue = (row["Đơn vị vận chuyển"] || '').trim();
                            const isEmpty = !shippingValue;
                            
                            return selectedShippingUnits.some(filter => {
                                if (filter === '__EMPTY__') return isEmpty;
                                return !isEmpty && shippingValue === filter;
                            });
                        });
                    }
                    
                    // Thêm logic lọc tracking
                    if (selectedTracking.length > 0) {
                        filteredData = filteredData.filter(row => {
                            const trackingValue = (row["Mã Tracking"] || "").trim();
                            const isEmpty = !trackingValue;
                            
                            return selectedTracking.some(filter => {
                                switch (filter) {
                                    case 'empty':
                                        return isEmpty;
                                    case 'not-empty':
                                        return !isEmpty;
                                    case 'numeric-start':
                                        return !isEmpty && /^\d/.test(trackingValue);
                                    default:
                                        return false;
                                }
                            });
                        });
                    }

                    if (nameQuery) {
                        filteredData = filteredData.filter(r =>
                            (r["Thông tin khách hàng"] || '').toLowerCase().includes(nameQuery) ||
                            (r["Phone*"] || '').toString().toLowerCase().includes(nameQuery) ||
                            (r["Mã đơn hàng"] || '').toLowerCase().includes(nameQuery) ||
                            (r["Mã Tracking"] || '').toLowerCase().includes(nameQuery)
                        );
                    }
                    
                    const columnFilters = {};
                    document.querySelectorAll('#DonChiTiet .filter-row .column-filter').forEach(element => {
                        const column = element.dataset.column;
                        if (element.tagName === 'INPUT') {
                            const value = element.value.trim();
                            if (value) columnFilters[column] = { type: element.type === 'date' ? 'date' : 'text', value: value.toLowerCase() };
                        } else if (element.classList.contains('multi-select-container')) {
                            const selected = Array.from(element.querySelectorAll('input[type="checkbox"]:checked:not(.select-all)')).map(cb => cb.value);
                            if (selected.length > 0) columnFilters[column] = { type: 'multiselect', value: new Set(selected) };
                        }
                    });

                    if (Object.keys(columnFilters).length > 0) {
                        filteredData = filteredData.filter(row => {
                            return Object.entries(columnFilters).every(([column, filter]) => {
                                const colMap = { "Nhân sự Marketing": "Nhân viên Marketing", "Nhân sự Sale": "Nhân viên Sale" };
                                let cellValue = row[colMap[column] || column] || '';

                                if (filter.type === 'multiselect') {
                                    return filter.value.has(String(cellValue));
                                }

                                if (filter.type === 'date') {
                                    const ymd = normalizeDateToYMD(cellValue);
                                    return ymd === filter.value;
                                }

                                if (column === 'Tổng tiền VNĐ') {
                                    const amount = parseMoneyToNumber(cellValue);
                                    return matchAmount(amount, filter.value);
                                }

                                return String(cellValue).toLowerCase().includes(filter.value);
                            });
                        });
                    }

                    this.updateSummaryBar(filteredData);
                    this.renderTables(filteredData);
                },
                updateSummaryBar(data) {
                    const totalCount = data.length;
                    const totalAmount = data.reduce((sum, row) => sum + (parseMoneyToNumber(row["Tổng tiền VNĐ"]) || 0), 0);
                    document.getElementById('totalOrdersCount').textContent = totalCount.toLocaleString('vi-VN');
                    document.getElementById('totalOrdersAmount').textContent = new Intl.NumberFormat('vi-VN').format(totalAmount) + ' ₫';
                },
                renderTables: function (data) {
                    const container = document.getElementById('DonChiTiet');

                    const headers = ["Mã đơn hàng","Mã Tracking","Ngày lên đơn","Thông tin khách hàng","Phone*","Mặt hàng","Số lượng mặt hàng 1","Tổng tiền VNĐ","Nhân sự Marketing","Nhân sự Sale","NV Vận đơn","Đơn vị vận chuyển","Trạng thái giao hàng NB","Kết quả Check","Trạng thái thu tiền"];

                    const groups = {
                        "HCM": data.filter(r => (r["Team"] || '').toLowerCase() === "hcm"),
                        "Hà Nội": data.filter(r => {
                        const t = (r["Team"] || '').toLowerCase();
                        return t === "hà nội" || t === "ha noi";
                        }),
                        "Chưa phân Team": data.filter(r => !r["Team"])
                    };

                    const summaryBar = container.querySelector('.summary-bar');
                    // Xóa các bảng cũ trước khi render lại
                    container.querySelectorAll('.region-container').forEach(c => c.remove());
                    this.tableCache.clear();

                    Object.entries(groups).forEach(([teamName, teamData]) => {
                        const safeId = `table-team-${teamName.replace(/\s+/g, '-').toLowerCase()}`;

                        const teamContainer = document.createElement('div');
                        teamContainer.className = 'region-container';
                        teamContainer.innerHTML = `
                            <h3 class="region-header">Team: ${teamName} (<span class="team-count">0</span> đơn)</h3>
                            <div class="table-wrapper">
                            <table id="${safeId}">
                                <thead></thead>
                                <tbody></tbody>
                            </table>
                            </div>
                        `;
                        container.appendChild(teamContainer); // Chèn vào cuối container
                        
                        this.tableCache.set(teamName, { container: teamContainer, tableId: safeId, headers });

                        this.renderTableHeader(safeId, headers);
                        this.renderTableBody(safeId, headers, teamData);
                        teamContainer.querySelector('.team-count').textContent = teamData.length.toLocaleString('vi-VN');
                        teamContainer.style.display = teamData.length ? '' : 'none'; // Ẩn bảng nếu không có dữ liệu
                    });
                },
                renderTableHeader: function(tableId, headers) {
                    const table = document.getElementById(tableId);
                    if (!table || table.querySelector('thead').innerHTML !== '') return;

                    const thead = table.querySelector('thead');
                    const titleRow = thead.insertRow();
                    titleRow.className = 'header-row';
                    headers.forEach(h => {
                        const th = document.createElement('th');
                        th.className = 'header-title';
                        th.textContent = h;
                        titleRow.appendChild(th);
                    });

                    const filterRow = thead.insertRow();
                    filterRow.className = 'filter-row';
                    headers.forEach(header => {
                        const th = document.createElement('th');
                        const filterOptions = {
                            "Ngày lên đơn": { type: 'date' },
                            "Mặt hàng": { type: 'multiselect', items: [...new Set(globalData.map(r => r["Mặt hàng"]).filter(Boolean))].sort() },
                            "NV Vận đơn": {
                                type: 'multiselect',
                                items: VandonNvRegion.mergeVanDonStaffFilterList(
                                    globalData,
                                    detailApp.vanDonStaffDirectory
                                ),
                            },
                            "Nhân sự Marketing": { type: 'multiselect', items: [...new Set(globalData.map(r => r["Nhân viên Marketing"]).filter(Boolean))].sort() },
                            "Nhân sự Sale": { type: 'multiselect', items: [...new Set(globalData.map(r => r["Nhân viên Sale"]).filter(Boolean))].sort() },
                            "Đơn vị vận chuyển": { type: 'multiselect', items: [...new Set(globalData.map(r => r["Đơn vị vận chuyển"]).filter(Boolean))].sort() }
                        };

                        const config = filterOptions[header];
                        if (config) {
                            if (config.type === 'date') {
                                const input = document.createElement('input');
                                input.type = 'date';
                                input.className = 'column-filter';
                                input.dataset.column = header;
                                input.addEventListener('input', () => this.applyFilters());
                                th.appendChild(input);
                            } else if (config.type === 'multiselect') {
                                th.appendChild(this.createColumnMultiSelect(header, config.items));
                            }
                        } else {
                            const input = document.createElement('input');
                            input.type = 'text';
                            input.placeholder = `Lọc theo ${header}`;
                            input.className = 'column-filter';
                            input.dataset.column = header;
                            input.addEventListener('input', () => this.applyFilters());
                            th.appendChild(input);
                        }
                        filterRow.appendChild(th);
                    });
                },
                renderTableBody: function (tableId, headers, data) {
                    const tbody = document.getElementById(tableId)?.querySelector('tbody');
                    if (!tbody) return;
                    tbody.innerHTML = '';

                    const colMap = { "Nhân sự Marketing": "Nhân viên Marketing", "Nhân sự Sale": "Nhân viên Sale" };
                    const CHUNK = 120;
                    let idx = 0;

                    function appendChunk() {
                        const end = Math.min(idx + CHUNK, data.length);
                        const frag = document.createDocumentFragment();
                        for (; idx < end; idx++) {
                            const row = data[idx];
                            const tr = document.createElement('tr');
                            headers.forEach(header => {
                                const td = document.createElement('td');
                                let value = row[colMap[header] || header] || '';
                                if (header === "Ngày lên đơn") {
                                    const ymd = normalizeDateToYMD(row["Ngày lên đơn"]);
                                    if (ymd) {
                                        const [y, m, d] = ymd.split('-');
                                        td.textContent = `${d}/${m}/${y}`;
                                    } else {
                                        td.textContent = '';
                                    }
                                } else if (header === "Tổng tiền VNĐ") {
                                    const num = parseMoneyToNumber(value);
                                    td.textContent = isNaN(num) ? '0 ₫' : new Intl.NumberFormat('vi-VN').format(num) + ' ₫';
                                } else {
                                    td.textContent = value;
                                }
                                tr.appendChild(td);
                            });
                            frag.appendChild(tr);
                        }
                        tbody.appendChild(frag);
                        if (idx < data.length) requestAnimationFrame(appendChunk);
                    }
                    if (data.length) requestAnimationFrame(appendChunk);
                },
                createColumnMultiSelect: function(header, items) {
                    const container = document.createElement('div');
                    container.className = 'multi-select-container column-filter';
                    container.dataset.column = header;

                    const button = document.createElement('button');
                    button.textContent = `Tất cả (${items.length})`;
                    const dropdown = document.createElement('div');
                    dropdown.className = 'checkbox-dropdown';
                    
                    dropdown.innerHTML = `<label><input type="checkbox" class="select-all"> <b>Chọn tất cả</b></label>`;
                    items.forEach(item => {
                        const encodedItem = item.replace(/"/g, '&quot;');
                        dropdown.innerHTML += `<label><input type="checkbox" value="${encodedItem}"> ${item}</label>`;
                    });
                    
                    container.append(button, dropdown);
                    
                    button.addEventListener('click', (e) => {
                        e.stopPropagation();
                        document.querySelectorAll('#DonChiTiet .filter-row .checkbox-dropdown.show').forEach(d => {
                            if (d !== dropdown) d.classList.remove('show');
                        });
                        dropdown.classList.toggle('show');
                    });

                    dropdown.addEventListener('change', (e) => {
                        if (e.target.classList.contains('select-all')) {
                            dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = e.target.checked);
                        }
                        this.updateColumnMultiSelectButtonText(button, dropdown);
                        this.applyFilters();
                    });
                    dropdown.addEventListener('click', e => e.stopPropagation());
                    return container;
                },
                updateColumnMultiSelectButtonText: function(button, dropdown) {
                    const selectedCount = dropdown.querySelectorAll('input[type="checkbox"]:checked:not(.select-all)').length;
                    const totalCount = dropdown.querySelectorAll('input[type="checkbox"]:not(.select-all)').length;
                    button.textContent = (selectedCount === 0 || selectedCount === totalCount) ? `Tất cả (${totalCount})` : `${selectedCount} đã chọn`;
                },
            };

            // --- KHỞI TẠO ỨNG DỤNG ---
            setDefaultDetailDateRange();
            detailApp.init();
            loadData({});
        });
    </script>
</body>
</html>
