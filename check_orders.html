<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminew Data Checker - Đối soát đơn hàng</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); padding: 40px; color: #1e293b; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { color: var(--primary); margin-bottom: 20px; font-size: 24px; }
        .upload-zone { border: 2px dashed #cbd5e1; padding: 40px; text-align: center; border-radius: 8px; margin-bottom: 30px; transition: 0.2s; }
        .upload-zone:hover { border-color: var(--primary); background: #eff6ff; }
        #fileInput { display: none; }
        .btn { background: var(--primary); color: white; padding: 12px 24px; border-radius: 6px; cursor: pointer; display: inline-block; font-weight: 600; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .stat-card { background: #f1f5f9; padding: 20px; border-radius: 8px; border-left: 4px solid var(--primary); }
        .stat-card div:first-child { font-size: 14px; color: #64748b; }
        .stat-card div:last-child { font-size: 24px; font-weight: bold; margin-top: 5px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #64748b; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
        .search-box { margin-bottom: 20px; width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; box-sizing: border-box; }
        .loading { display: none; color: var(--primary); font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 Đối soát dữ liệu Backup Đơn hàng</h1>
    <p>Công cụ hỗ trợ thống kê số lượng đơn hàng từ file JSON để so sánh với Supabase.</p>

    <div class="upload-zone" id="dropZone">
        <label for="fileInput" class="btn">📁 Chọn file JSON backup</label>
        <input type="file" id="fileInput" accept=".json">
        <p style="margin-top: 15px; color: #64748b;">(Hỗ trợ file lớn > 70MB)</p>
    </div>

    <div id="loading" class="loading">⚡ Đang xử lý dữ liệu...</div>

    <div id="summary" style="display: none;">
        <div class="stats-grid">
            <div class="stat-card">
                <div>Tổng số đơn hàng</div>
                <div id="totalOrders">0</div>
            </div>
            <div class="stat-card">
                <div>Tổng số ngày</div>
                <div id="totalDays">0</div>
            </div>
        </div>

        <input type="text" class="search-box" id="searchBox" placeholder="Lọc theo ngày (ví dụ: 2026-04-03)...">

        <table id="statsTable">
            <thead>
                <tr>
                    <th>Ngày (order_date)</th>
                    <th>Số lượng đơn</th>
                    <th>Tình trạng dự kiến</th>
                </tr>
            </thead>
            <tbody id="statsBody"></tbody>
        </table>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const loading = document.getElementById('loading');
    const summary = document.getElementById('summary');
    const statsBody = document.getElementById('statsBody');
    const searchBox = document.getElementById('searchBox');

    let dailyStats = [];

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        loading.style.display = 'block';
        summary.style.display = 'none';

        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                const data = JSON.parse(event.target.result);
                processData(data);
            } catch (err) {
                alert('Lỗi: File JSON không đúng định dạng!');
                loading.style.display = 'none';
            }
        };
        reader.readAsText(file);
    });

    function processData(orders) {
        const stats = {};
        orders.forEach(order => {
            const date = order.order_date || 'Không có ngày';
            stats[date] = (stats[date] || 0) + 1;
        });

        dailyStats = Object.keys(stats).sort().reverse().map(date => ({
            date: date,
            count: stats[date]
        }));

        document.getElementById('totalOrders').textContent = orders.length.toLocaleString();
        document.getElementById('totalDays').textContent = dailyStats.length;

        renderTable(dailyStats);
        loading.style.display = 'none';
        summary.style.display = 'block';
    }

    function renderTable(data) {
        statsBody.innerHTML = '';
        data.forEach(stat => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${stat.date}</strong></td>
                <td>${stat.count.toLocaleString()} đơn</td>
                <td><span style="color: green">✓ Đã sẵn sàng đối soát</span></td>
            `;
            statsBody.appendChild(row);
        });
    }

    searchBox.addEventListener('input', function(e) {
        const term = e.target.value.toLowerCase();
        const filtered = dailyStats.filter(s => s.date.toLowerCase().includes(term));
        renderTable(filtered);
    });
</script>

</body>
</html>
